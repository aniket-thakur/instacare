plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
    id("com.google.protobuf") version "0.9.5" // Protobuf plugin for Gradle
}

group = 'com.instacare'
version = '0.0.1-SNAPSHOT'
description = 'billing-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}
// consistent versions
ext {
    grpcVersion = '1.75.0'
    protobufVersion = '4.32.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("io.github.lognet:grpc-spring-boot-starter:5.2.0")
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
    // gRPC dependencies - all IMPLEMENTATION scope
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
}
def generatedFilesBaseDir = "${buildDir}/generated/source/proto"
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    clean {
        delete generatedFilesBaseDir
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}  // Add gRPC plugin to each task
        }
    }
}


sourceSets {
    main {
        java {
            srcDir "${generatedFilesBaseDir}/main/java"
            srcDir "${generatedFilesBaseDir}/main/grpc"
        }
    }
}

// proto generation happens before compilation
compileJava {
    dependsOn 'generateProto'
}


tasks.named('test') {
	useJUnitPlatform()
}
